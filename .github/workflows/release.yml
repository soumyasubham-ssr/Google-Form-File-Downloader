name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v2.1.0 (must match gffd/__init__.py)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest pyinstaller
      - run: python -m pytest -q
      - name: Check version matches tag
        shell: bash
        run: |
          v=$(python -c "import gffd; print(gffd.__version__)")
          [ "v$v" = "${{ inputs.tag }}" ] || { echo "Version $v does not match ${{ inputs.tag }}"; exit 1; }
      - run: pyinstaller --noconfirm "Google Form File Downloader.spec"
      - name: Package
        shell: bash
        run: |
          name="Google.Form.File.Downloader.${{ inputs.tag }}.exe"
          mv "dist/Google Form File Downloader.exe" "dist/$name"
          (cd dist && sha256sum "$name" > SHA256SUMS.txt)
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ inputs.tag }}"; ver="${ver#v}"
          awk -v v="$ver" 'index($0, "## [" v "]")==1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "${{ inputs.tag }}" dist/*.exe dist/SHA256SUMS.txt \
            --title "${{ inputs.tag }}" --notes-file notes.md --target "${{ github.sha }}"
